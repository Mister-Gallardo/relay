<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f12" />
    <meta name="description" content="Веб-клиент мессенджера MAX на базе GREEN-API" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Relay</title>
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('relay:theme') || 'null')
        var preference = (stored && stored.state && stored.state.preference) || 'dark'
        var theme =
          preference === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference
        document.documentElement.dataset.theme = theme
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
